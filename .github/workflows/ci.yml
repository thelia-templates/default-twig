name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  merge_group:

# A new push to a pull request makes its previous run pointless: cancel it and
# give the runners back. Runs on main and in the merge queue are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php-lint:
    name: PHP syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: none

      - name: Lint every PHP file of the theme
        # src/ holds the bundle, tests/ its suite and translations/ the catalogues;
        # all of them are parsed at runtime or by the suite.
        run: git ls-files -z '*.php' | xargs -0 -n1 -P4 php -l

  phpstan:
    name: PHPStan level 5 (PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Without a token, Flex silently skips the thelia/thelia-recipes endpoint
      # and the GitHub archives the other themes are downloaded from are rate
      # limited.
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
    steps:
      - name: Checkout the theme
        uses: actions/checkout@v4
        with:
          path: theme

      - name: Checkout Thelia
        # The gate is the one the core runs on its own pull requests
        # (phpstan-botwig.neon and its baseline). Running it here, on the theme as
        # it stands in the pull request, is what stops a change that turns the
        # core check red from being merged.
        uses: actions/checkout@v4
        with:
          repository: thelia/thelia
          ref: main
          path: thelia

      - name: Start MySQL
        # The runner ships MySQL pre-installed (root/root on 127.0.0.1:3306); using
        # it avoids the flaky service-container init on this runner image.
        run: sudo systemctl start mysql.service

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          ini-values: post_max_size=20M
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, mysql, gd, zip
          coverage: none

      - name: Resolve this theme from the checkout and the others from their branch
        # A Composer path repository with a forced version, as for the core's own
        # `core/` directory: without it `composer update` would pull the published
        # tag and the pull request under test would never be analysed. The other
        # themes come from their development branch, as in the core workflow.
        working-directory: thelia
        run: |
          composer config repositories.default-twig-checkout '{"type":"path","url":"../theme","options":{"symlink":false,"versions":{"thelia/backoffice-default-twig-template":"1.99.0"}}}'
          composer require --no-update --no-scripts --no-audit \
            "thelia/flexy:dev-main as 1.99.0" \
            "thelia/email-default-template:dev-main as 1.99.0" \
            "thelia/pdf-default-template:dev-main as 1.99.0"

      - name: Install Composer dependencies
        working-directory: thelia
        run: composer update --no-progress --prefer-dist --optimize-autoloader

      - name: Restore the project schema the config package overwrote
        # The thelia/config package installs into local/ and replaces the
        # version-controlled local/config/schema.xml.
        working-directory: thelia
        run: git checkout -- local/config/schema.xml

      - name: Check that the theme under test is the one installed
        # 1.99.0 can only come from the path repository above.
        working-directory: thelia
        run: |
          version=$(composer show thelia/backoffice-default-twig-template --format=json | jq -r '.versions[0]')
          echo "thelia/backoffice-default-twig-template -> $version"
          test "$version" = "1.99.0"
          test -f templates/backOffice/default-twig/base.html.twig

      - name: Prepare the test database
        # PHPStan needs the Propel models, which bin/test-prepare generates.
        working-directory: thelia
        run: |
          printf 'DATABASE_HOST=127.0.0.1\nDATABASE_PORT=3306\nDATABASE_USER=root\nDATABASE_PASSWORD=root\nDATABASE_NAME=test\n' > .env.test.local
          php bin/test-prepare

      - name: PHPStan (level and paths come from phpstan-botwig.neon)
        working-directory: thelia
        run: ./vendor/bin/phpstan analyse -c phpstan-botwig.neon --no-progress --error-format=github

  theme:
    name: Theme in a Thelia checkout (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    # A leaked DB transaction once kept a core DDL test waiting on a metadata
    # lock until the runner limit; keep the same guard here.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 8.3 is the supported floor, 8.4 the other version the core is tested on.
        php: [ '8.3', '8.4' ]
    env:
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
    steps:
      - name: Checkout the theme
        uses: actions/checkout@v4
        with:
          path: theme

      - name: Checkout Thelia
        # A theme is not an application: it has no kernel and no bin/console of
        # its own. The lint, its suite and the core back-office suite all need a
        # host, and the host is the core.
        uses: actions/checkout@v4
        with:
          repository: thelia/thelia
          ref: main
          path: thelia

      - name: Start MySQL
        run: sudo systemctl start mysql.service

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          ini-values: post_max_size=20M
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, mysql, gd, zip
          coverage: none

      - name: Resolve this theme from the checkout and the others from their branch
        # The front-office suites of the core are not run here, but the project
        # needs a front theme, and an e-mail and a PDF theme, to install.
        working-directory: thelia
        run: |
          composer config repositories.default-twig-checkout '{"type":"path","url":"../theme","options":{"symlink":false,"versions":{"thelia/backoffice-default-twig-template":"1.99.0"}}}'
          composer require --no-update --no-scripts --no-audit \
            "thelia/flexy:dev-main as 1.99.0" \
            "thelia/email-default-template:dev-main as 1.99.0" \
            "thelia/pdf-default-template:dev-main as 1.99.0"

      - name: Install Composer dependencies
        working-directory: thelia
        run: composer update --no-progress --prefer-dist --optimize-autoloader

      - name: Restore the project schema the config package overwrote
        working-directory: thelia
        run: git checkout -- local/config/schema.xml

      - name: Check that the theme under test is the one installed
        working-directory: thelia
        run: |
          version=$(composer show thelia/backoffice-default-twig-template --format=json | jq -r '.versions[0]')
          echo "thelia/backoffice-default-twig-template -> $version"
          test "$version" = "1.99.0"
          test -f templates/backOffice/default-twig/base.html.twig

      - name: Prepare the test database credentials
        working-directory: thelia
        run: printf 'DATABASE_HOST=127.0.0.1\nDATABASE_PORT=3306\nDATABASE_USER=root\nDATABASE_PASSWORD=root\nDATABASE_NAME=test\n' > .env.test.local

      - name: Install the test database
        # Everything below reads the active templates from the database.
        working-directory: thelia
        run: composer test:prepare

      - name: Restore the Sass and Tailwind binaries
        # sass:build and tailwind:build download their binary from the GitHub
        # releases when it is missing, and a 500 from github.com failed a whole
        # core job once.
        uses: actions/cache@v4
        with:
          path: |
            thelia/var/dart-sass
            thelia/var/tailwind/v*
          key: asset-binaries-${{ runner.os }}-${{ hashFiles('thelia/composer.json') }}
          restore-keys: asset-binaries-${{ runner.os }}-

      - name: Build the theme assets and warm the test container
        # A back-office page whose assets are missing raises an exception that
        # the core's assertPageRenders() turns into a skipped test; building the
        # assets is what keeps the suite from proving nothing.
        working-directory: thelia
        run: |
          php bin/console importmap:install --env=test --no-debug
          php bin/console tailwind:build --env=test --no-debug
          php bin/console sass:build --env=test --no-debug
          php bin/console cache:warmup --env=test --no-debug

      - name: Lint the theme templates
        working-directory: thelia
        run: php bin/console lint:twig --env=test --no-debug templates/backOffice/default-twig

      - name: Run the theme's own test suite
        # A theme has no vendor/ and no kernel of its own, so its suite runs with
        # the host's PHPUnit and autoloader, from the host root.
        working-directory: thelia
        run: php vendor/bin/phpunit -c templates/backOffice/default-twig/phpunit.xml.dist --display-deprecations

      - name: Run the core http-backoffice suite against this checkout
        # --fail-on-skipped: a core test that skips because the theme lacks a page
        # is not a pass, it is a test that will run, and may fail, once the theme
        # is merged (it turned main red once). With the assets built this suite
        # has no skip (203 tests, 0 skipped on 17/10/2026).
        working-directory: thelia
        run: composer test:http-backoffice -- --display-deprecations --display-skipped --fail-on-skipped
